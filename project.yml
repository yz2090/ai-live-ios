name: AiLiveLite
options:
  bundleIdPrefix: com.ailive
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  AiLiveLite:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AiLiveLite
        excludes:
          - "Info.plist"
    info:
      path: AiLiveLite/Info.plist
      properties:
        CFBundleName: AI播放端
        CFBundleDisplayName: AI播放端
        CFBundleIdentifier: com.ailive.liteplayer
        CFBundleVersion: "1"
        CFBundleShortVersionString: 1.0.0
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        ServerHost: $(OPENCLAW_SERVER_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailive.liteplayer
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: AiLiveLite/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    scheme:
      testTargets: []
  OpenClawShell:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: OpenClawShell
        excludes:
          - "Info.plist"
    info:
      path: OpenClawShell/Info.plist
      properties:
        CFBundleName: OpenClaw
        CFBundleDisplayName: OpenClaw
        CFBundleIdentifier: com.ailive.openclawshell
        CFBundleVersion: "1"
        CFBundleShortVersionString: 1.0.0
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        ServerURL: $(OPENCLAW_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailive.openclawshell
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OpenClawShell/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    scheme:
      testTargets: []
  SelfMgmtShell:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SelfMgmtShell
        excludes:
          - "Info.plist"
    info:
      path: SelfMgmtShell/Info.plist
      properties:
        CFBundleName: 个人管理
        CFBundleDisplayName: 个人管理
        CFBundleIdentifier: com.ailive.selfmgmt
        CFBundleVersion: "1"
        CFBundleShortVersionString: 1.0.0
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        ServerURL: http://59.110.152.66:18888
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailive.selfmgmt
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SelfMgmtShell/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    scheme:
      testTargets: []
  OpenClawNative:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: OpenClawNative
        excludes:
          - "Info.plist"
    info:
      path: OpenClawNative/Info.plist
      properties:
        CFBundleName: OpenClaw
        CFBundleDisplayName: OpenClaw
        CFBundleIdentifier: com.ailive.openclawnative
        CFBundleVersion: "1"
        CFBundleShortVersionString: 1.0.0
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
