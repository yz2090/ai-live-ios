name: Build OpenClaw Shell IPA

on:
  push:
    paths:
      - 'OpenClawShell/**'
      - 'project.yml'
  workflow_dispatch:

env:
  OPENCLAW_SERVER_URL: ${{ secrets.OPENCLAW_SERVER_URL }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build device (unsigned IPA)
        run: |
          xcodebuild -project AiLiveLite.xcodeproj \
            -scheme OpenClawShell \
            OPENCLAW_SERVER_URL="$OPENCLAW_SERVER_URL" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build \
            -quiet
          echo "✅ Device 编译通过"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | grep -i OpenClawShell | head -1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 打包未签名 IPA（Sideloadly/AltStore 安装时会自动重签）
          zip -r -q OpenClawShell-unsigned.ipa Payload
          ls -la OpenClawShell-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawShell-ipa
          path: OpenClawShell-unsigned.ipa
