name: Build Tweak

on:
  push:
    paths:
      - 'tweak/**'
  workflow_dispatch:

jobs:
  build-tweak:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Build Tweak (用 Xcode 自带 SDK)
        run: |
          export THEOS=~/theos
          # 找 Xcode 里的 iOS SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH"
          # Theos 会自动探测 Xcode SDK，无需额外下载
          cd tweak/violation-alert
          make clean
          make package
          echo "=== 产物 ==="
          find . -name "*.deb" -exec ls -la {} \;

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ViolationAlert-deb
          path: tweak/violation-alert/*.deb
